name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Live site (unchanged root): deployments/testnet.json → /third-chair/
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      # Isolated TEST contract preview at distinct path /third-chair/test/
      # Does not overwrite the live route; separate Vite base + deployment JSON.
      - name: Build TEST contract preview
        run: |
          VITE_DEPLOYMENT=testnet-test.json VITE_BASE=/third-chair/test/ npm run build -- --outDir dist-test
          mkdir -p dist/test
          cp -a dist-test/. dist/test/
          cp dist/test/index.html dist/test/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
